<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Inspeksi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }
    .legend { background: white; padding: 10px; border-radius: 5px; font-size: 12px; line-height: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
    .legend i { width: 12px; height: 12px; float: left; margin-right: 8px; margin-top: 4px; border-radius: 50%; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ⚠️ GANTI TULISAN DI BAWAH DENGAN URL APPS SCRIPT YANG SAMA
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLJCT-IrxFHXdlKdj2w9ZcIok9egprfe_KcvjtREpIup4Ra05VRVeqqS9--3kcaPjlzQ/exec";

  const map = L.map('map').setView([-2.2, 115.3], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  function getColor(kategori) {
    switch (kategori) {
      case 'Titik Bocor':  return '#e74c3c'; // Merah
      case 'Clamp':        return '#f39c12'; // Oranye
      case 'Patching':     return '#3498db'; // Biru
      case 'Sleeve B':     return '#9b59b6'; // Ungu
      default:             return '#2ecc71'; // Hijau
    }
  }

  function createCustomIcon(color) {
    return L.divIcon({
      html: `<div style="background-color:${color}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });
  }

  async function loadMapData() {
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      const rows = data.slice(1);
      const bounds = [];

      rows.forEach(row => {
        const timestamp  = row[0];
        const lat        = parseFloat(row[1]);
        const lon        = parseFloat(row[2]);
        const kategori   = row[3] || 'Lainnya';
        const kondisi    = row[4] || '-';
        const namaJalan  = row[5] || '-';
        const keterangan = row[6] || '-';

        if (!isNaN(lat) && !isNaN(lon)) {
          const color = getColor(kategori);
          const icon = createCustomIcon(color);

          const popupContent = `
            <b>${kategori}</b><br>
            <b>Kondisi:</b> ${kondisi}<br>
            <b>Lokasi:</b> ${namaJalan}<br>
            <b>Ket:</b> ${keterangan}<br>
            <small style="color:#777">${new Date(timestamp).toLocaleString('id-ID')}</small>
          `;

          L.marker([lat, lon], { icon: icon }).bindPopup(popupContent).addTo(map);
          bounds.push([lat, lon]);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    } catch (e) {
      console.error(e);
    }
  }

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <b>Kategori</b><br>
      <i style="background: #e74c3c;"></i> Titik Bocor<br>
      <i style="background: #f39c12;"></i> Clamp<br>
      <i style="background: #3498db;"></i> Patching<br>
      <i style="background: #9b59b6;"></i> Sleeve B<br>
      <i style="background: #2ecc71;"></i> Rutin / Lainnya
    `;
    return div;
  };
  legend.addTo(map);

  loadMapData();
</script>
</body>
</html>
