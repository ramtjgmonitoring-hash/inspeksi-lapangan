<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Inspector Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #eef2f5; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; text-align: center; color: #1a252f; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    label.title-label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #2c3e50; }
    
    /* Style Pilihan Radio Button */
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-option {
      display: flex; align-items: center; padding: 12px; background: #f8f9fa;
      border: 1px solid #dcdfe6; border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .radio-option:hover { background: #eef5ff; border-color: #3498db; }
    .radio-option input { margin-right: 10px; width: 18px; height: 18px; accent-color: #27ae60; }
    .radio-option span { font-size: 14px; font-weight: 500; }

    textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
    
    .btn-container { display: flex; gap: 10px; margin-top: 15px; }
    .btn-save { flex: 1; background: #27ae60; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn-map { flex: 1; background: #2980b9; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; text-align: center; line-height: 18px; }
    .btn-save:active, .btn-map:active { transform: scale(0.98); }
    
    #status { margin-top: 15px; font-size: 13px; text-align: center; white-space: pre-line; font-weight: bold; color: #333; }
    
    /* Style Riwayat & Link Maps */
    .history-card { margin-top: 20px; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
    .history-item { font-size: 13px; margin-bottom: 8px; padding-bottom: 8px; }
    .gmaps-link { display: inline-block; margin-top: 6px; color: #1d4ed8; text-decoration: none; font-weight: bold; font-size: 12px; }
    .gmaps-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 Field Inspector Pro</h2>

  <div class="form-group">
    <label class="title-label">Kategori / Status Penanganan:</label>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" name="kategori" value="Titik Bocor" checked>
        <span>🔴 Titik Bocor (Leak Point)</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="kategori" value="Clamp">
        <span>🟠 Clamp</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="kategori" value="Patching">
        <span>🔵 Patching</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="kategori" value="Sleeve B">
        <span>🟣 Sleeve B Repair</span>
      </label>
    </div>
  </div>

  <div class="form-group">
    <label class="title-label">Keterangan Tambahan:</label>
    <textarea id="keterangan" rows="3" placeholder="Catatan teknis ukuran/kondisi lapangan..."></textarea>
  </div>

  <div class="btn-container">
    <button class="btn-save" onclick="processAndSave()">🚀 SIMPAN LOKASI</button>
    <a href="map.html" class="btn-map">📁 LIHAT PETA</a>
  </div>

  <div id="status"></div>

  <div class="history-card" id="historyBox" style="display:none;">
    <strong style="font-size:13px; color:#334155;">📋 Riwayat Data Terakhir:</strong>
    <div id="historyContent" style="margin-top:8px;"></div>
  </div>
</div>

<script>
  // PENTING: Ganti URL di bawah dengan Web App URL dari Google Apps Script Anda
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxhGVCzXvAdjsZt-M6XJAEAO6caKyfn8GpsGtHjGfl6WS-r6jvyTi_CQVPP9qKTr4BsA/exec";

  async function getStreetName(lat, lon) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
      const data = await res.json();
      return data.display_name || "Nama jalan tidak ditemukan";
    } catch (e) {
      return "Gagal mendapatkan nama jalan";
    }
  }

  function processAndSave() {
    const status = document.getElementById('status');
    const selectedKategori = document.querySelector('input[name="kategori"]:checked').value;
    const keterangan = document.getElementById('keterangan').value;

    status.innerText = "⏳ 1/3 Mengunci Koordinat GPS...";

    if (!navigator.geolocation) {
      status.innerText = "❌ GPS tidak didukung di browser ini.";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        status.innerText = "⏳ 2/3 Mencari Nama Jalan...";
        const namaJalan = await getStreetName(lat, lon);

        status.innerText = "⏳ 3/3 Menyimpan ke Database...";

        const payload = {
          latitude: lat,
          longitude: lon,
          kategori: selectedKategori,
          kondisi: "-",
          keterangan: keterangan,
          namaJalan: namaJalan,
          accuracy: acc
        };

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(payload)
        })
        .then(() => {
          status.innerText = "✅ DATA BERHASIL TERSIMPAN!";
          
          const gmapsUrl = `https://maps.google.com/?q=${lat},${lon}`;
          const historyBox = document.getElementById('historyBox');
          const historyContent = document.getElementById('historyContent');
          
          if (historyBox && historyContent) {
            historyBox.style.display = 'block';
            historyContent.innerHTML = `
              <div class="history-item">
                <strong>${selectedKategori}</strong><br>
                📍 ${namaJalan}<br>
                <a href="${gmapsUrl}" target="_blank" class="gmaps-link">🗺️ Buka di Google Maps App</a>
              </div>
            `;
          }

          document.getElementById('keterangan').value = '';
        })
        .catch(err => {
          status.innerText = "❌ Gagal menyimpan data.";
          console.error(err);
        });
      },
      (err) => { status.innerText = "❌ Gagal mengambil GPS: " + err.message; },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }
</script>

</body>
</html>
