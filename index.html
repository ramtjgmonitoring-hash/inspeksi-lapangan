<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logger Inspeksi</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #eef2f5; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; text-align: center; color: #2c3e50; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .btn-save { background: **#27ae60**; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 15px; font-size: 13px; text-align: center; white-space: pre-line; }
  </style>
</head>
<body>
<div class="card">
  <h2>📍 Logger Inspeksi</h2>

  <div class="form-group">
    <label>Kategori / Status:</label>
    <select id="kategori">
      <option value="Titik Bocor">Titik Bocor</option>
      <option value="Clamp">Clamp</option>
      <option value="Patching">Patching</option>
      <option value="Sleeve B">Sleeve B</option>
      <option value="Inspeksi Rutin">Inspeksi Rutin</option>
    </select>
  </div>

  <div class="form-group">
    <label>Kondisi / Penyebab:</label>
    <input type="text" id="kondisi" placeholder="Misal: Korosif, Retak">
  </div>

  <div class="form-group">
    <label>Keterangan Tambahan:</label>
    <textarea id="keterangan" rows="3" placeholder="Catatan teknis..."></textarea>
  </div>

  <button class="btn-save" onclick="processAndSave()">🚀 AMBIL LOKASI & SIMPAN</button>
  <div id="status"></div>
</div>

<script>
  // ⚠️ GANTI TULISAN DI BAWAH DENGAN URL APPS SCRIPT YANG ANDA SIMPAN TADI
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLJCT-IrxFHXdlKdj2w9ZcIok9egprfe_KcvjtREpIup4Ra05VRVeqqS9--3kcaPjlzQ/exec";

  async function getStreetName(lat, lon) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
      const data = await res.json();
      return data.display_name || "Nama jalan tidak ditemukan";
    } catch (e) {
      return "Gagal mendapatkan nama jalan";
    }
  }

  function processAndSave() {
    const status = document.getElementById('status');
    const kategori = document.getElementById('kategori').value;
    const kondisi = document.getElementById('kondisi').value;
    const keterangan = document.getElementById('keterangan').value;

    status.innerText = "⏳ 1/3 Mengunci Koordinat GPS...";

    if (!navigator.geolocation) {
      status.innerText = "❌ GPS tidak didukung di browser ini.";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        status.innerText = "⏳ 2/3 Mencari Nama Jalan...";
        const namaJalan = await getStreetName(lat, lon);

        status.innerText = "⏳ 3/3 Menyimpan ke Database...";

        const payload = {
          latitude: lat,
          longitude: lon,
          kategori: kategori,
          kondisi: kondisi,
          keterangan: keterangan,
          namaJalan: namaJalan,
          accuracy: acc
        };

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          status.innerText = `✅ TERSIMPAN!\nAlamat: ${namaJalan}`;
          document.getElementById('kondisi').value = '';
          document.getElementById('keterangan').value = '';
        })
        .catch(err => {
          status.innerText = "❌ Gagal menyimpan data.";
        });
      },
      (err) => { status.innerText = "❌ Gagal mengambil GPS: " + err.message; },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }
</script>
</body>
</html>
