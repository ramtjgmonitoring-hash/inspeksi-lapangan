<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Inspector Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; background: #eef2f5; margin: 0; }
    .card { background: white; padding: 16px; border-radius: 12px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; text-align: center; color: #1a252f; font-size: 18px; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label.title-label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 12px; color: #2c3e50; }
    
    /* Grid Horizontal Kategori */
    .radio-grid-kategori { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    
    /* Grid Horizontal Ukuran Pipa */
    .radio-grid-pipa { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }

    .radio-card {
      display: flex; align-items: center; justify-content: center; padding: 6px 4px; background: #f8f9fa;
      border: 1px solid #dcdfe6; border-radius: 6px; cursor: pointer; transition: 0.2s; user-select: none;
    }
    .radio-card:hover { background: #eef5ff; border-color: #3498db; }
    .radio-card input { margin-right: 4px; width: 14px; height: 14px; accent-color: #27ae60; cursor: pointer; }
    .radio-card span { font-size: 11px; font-weight: 600; color: #333; }

    textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 12px; resize: vertical; }
    
    .btn-container { display: flex; gap: 8px; margin-top: 12px; }
    .btn-save { flex: 1; background: #27ae60; color: white; border: none; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-map { flex: 1; background: #2980b9; color: white; border: none; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; text-align: center; line-height: 16px; }
    .btn-save:active, .btn-map:active { transform: scale(0.98); }
    
    #status { margin-top: 10px; font-size: 12px; text-align: center; white-space: pre-line; font-weight: bold; color: #333; }
    
    .history-card { margin-top: 15px; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; }
    .history-item { font-size: 12px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
    .history-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .history-date { font-size: 10px; color: #64748b; margin-top: 2px; }
    .gmaps-link { display: inline-block; margin-top: 4px; color: #1d4ed8; text-decoration: none; font-weight: bold; font-size: 11px; }
    .gmaps-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 Field Inspector Pro</h2>

  <!-- Status Penanganan -->
  <div class="form-group">
    <label class="title-label">Status Penanganan:</label>
    <div class="radio-grid-kategori">
      <label class="radio-card">
        <input type="radio" name="kategori" value="Clamp" checked>
        <span>🟠 Clamp</span>
      </label>
      <label class="radio-card">
        <input type="radio" name="kategori" value="Patching">
        <span>🔵 Patching</span>
      </label>
      <label class="radio-card">
        <input type="radio" name="kategori" value="Sisip">
        <span>🟣 Sisip</span>
      </label>
    </div>
  </div>

  <!-- Ukuran Pipa -->
  <div class="form-group">
    <label class="title-label">Ukuran Pipa (Inch):</label>
    <div class="radio-grid-pipa">
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="2 Inch"><span>2"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="3 Inch"><span>3"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="4 Inch"><span>4"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="6 Inch" checked><span>6"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="8 Inch"><span>8"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="10 Inch"><span>10"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="12 Inch"><span>12"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="16 Inch"><span>16"</span></label>
      <label class="radio-card"><input type="radio" name="ukuranPipa" value="20 Inch"><span>20"</span></label>
    </div>
  </div>

  <!-- Keterangan -->
  <div class="form-group">
    <label class="title-label">Catatan Tambahan (Opsional):</label>
    <textarea id="keterangan" rows="2" placeholder="Catatan kondisi lapangan..."></textarea>
  </div>

  <div class="btn-container">
    <button class="btn-save" onclick="processAndSave()">🚀 SIMPAN LOKASI</button>
    <a href="map.html" class="btn-map">📁 LIHAT PETA</a>
  </div>

  <div id="status"></div>

  <div class="history-card" id="historyBox">
    <strong style="font-size:12px; color:#334155;">📋 Riwayat Data Tersimpan (Tim):</strong>
    <div id="historyContent" style="margin-top:6px; font-size: 11px; color: #666;">Memuat riwayat data...</div>
  </div>
</div>

<script>
  // PENTING: Pastikan Web App URL Google Apps Script Anda terpasang di sini
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2zAJEkblbiXRo7sjzgjQnXrYisjwSJxPpTHnmNeghmvFuZJDgW6uz7ACaCUXLohDfHw/exec";

  async function loadHistoryFromSheets() {
    const historyContent = document.getElementById('historyContent');
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();
      const rows = data.slice(1);
      
      if (rows.length === 0) {
        historyContent.innerText = "Belum ada riwayat data tersimpan.";
        return;
      }

      let historyHTML = "";
      for (let i = rows.length - 1; i >= 0; i--) {
        const row = rows[i];
        const rawDate = row[0] ? new Date(row[0]) : null;
        const timestamp = rawDate && !isNaN(rawDate) 
          ? rawDate.toLocaleString('id-ID', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) 
          : 'Data Manual';

        const lat = String(row[1]).trim().replace(',', '.');
        const lon = String(row[2]).trim().replace(',', '.');
        const kategori = row[3] || '-';
        const namaJalan = row[5] || 'Alamat tidak dicatat';
        const keterangan = row[6] || '';
        
        const gmapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

        historyHTML += `
          <div class="history-item">
            <strong style="color:#1e293b;">${kategori}</strong> ${keterangan ? `(${keterangan})` : ''}<br>
            📍 <span style="color:#475569;">${namaJalan}</span><br>
            🕒 <span class="history-date">${timestamp}</span><br>
            <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" class="gmaps-link">🗺️ Buka di Google Maps App</a>
          </div>
        `;
      }
      historyContent.innerHTML = historyHTML;
    } catch (e) {
      console.error(e);
      historyContent.innerText = "Gagal memuat riwayat data.";
    }
  }

  async function getStreetName(lat, lon) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
      const data = await res.json();
      return data.display_name || "Nama jalan tidak ditemukan";
    } catch (e) {
      return "Gagal mendapatkan nama jalan";
    }
  }

  function processAndSave() {
    const status = document.getElementById('status');
    const selectedKategori = document.querySelector('input[name="kategori"]:checked').value;
    const selectedUkuran = document.querySelector('input[name="ukuranPipa"]:checked').value;
    const catatanInput = document.getElementById('keterangan').value.trim();

    // Gabungkan ukuran pipa ke dalam keterangan
    const keteranganLengkap = catatanInput ? `Pipa ${selectedUkuran} - ${catatanInput}` : `Pipa ${selectedUkuran}`;

    status.innerText = "⏳ 1/3 Mengunci Koordinat GPS...";

    if (!navigator.geolocation) {
      status.innerText = "❌ GPS tidak didukung di browser ini.";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        status.innerText = "⏳ 2/3 Mencari Nama Jalan...";
        const namaJalan = await getStreetName(lat, lon);

        status.innerText = "⏳ 3/3 Menyimpan ke Database...";

        const payload = {
          latitude: lat,
          longitude: lon,
          kategori: selectedKategori,
          kondisi: "-",
          keterangan: keteranganLengkap,
          namaJalan: namaJalan,
          accuracy: acc
        };

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(payload)
        })
        .then(() => {
          status.innerText = "✅ DATA BERHASIL TERSIMPAN!";
          document.getElementById('keterangan').value = '';
          setTimeout(loadHistoryFromSheets, 1500);
        })
        .catch(err => {
          status.innerText = "❌ Gagal menyimpan data.";
          console.error(err);
        });
      },
      (err) => { status.innerText = "❌ Gagal mengambil GPS: " + err.message; },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  loadHistoryFromSheets();
</script>

</body>
</html>
